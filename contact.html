<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-page="contact">
  <div class="room">
    <div class="wall"></div>
    <div class="trim"></div>
    <div class="floor"><div class="floor-plane"></div></div>

  <header class="wall-head">
    <a class="signature" href="index.html">Ethan’s Bicycle Shop</a>
    <nav class="menu" aria-label="Main">
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-list">Menu</button>
      <ul class="menu-list" id="menu-list">
        <li><a href="index.html">Pieces</a></li>
        <li><a href="archives.html">Archive</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
    <div class="head-tools">
      <button class="theme-toggle" type="button" aria-label="Switch to the cream wall">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.6A7.8 7.8 0 0 1 9.4 4.5a7.8 7.8 0 1 0 10.1 10.1z"/></svg>
      </button>
      <button class="cart-button" type="button" aria-controls="cart" aria-expanded="false" aria-label="Cart, 0 items">

        <span class="cart-label">Cart</span>
      </button>
    </div>

  <main class="detail detail--solo">
    <article class="wall-text">
      <h1>Say hello.</h1>
      <p class="desc">For commissions, available originals and editions, or just to talk about the work, send me a note.</p>
      <dl class="contact-list">
        <dt>Email</dt>
        <dd><a href="mailto:ethancraparo@icloud.com">ethancraparo@icloud.com</a></dd>
        <dt>Instagram</dt>
        <dd><a href="https://www.instagram.com/ethancraparo/" rel="noopener">@ethancraparo</a></dd>
      </dl>
      <nav class="steps" aria-label="More">
        <a href="index.html">← Back to the wall</a>
      </nav>
    </article>
  </main>

  <div class="veil" aria-hidden="true"></div>

  <script src="assets/js/floor.js"></script>
  <script src="assets/js/wall.js"></script>
  <script src="assets/js/artworks.js"></script>
  <script src="assets/js/gallery.js"></script>
